[package]
name = "portique"
version = "0.1.0"
description = "Tabbed SSH, Telnet and Serial terminal"
authors = ["Adam Pilbeam"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "portique_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.64.1"
russh-sftp = "3.0.1"
tokio = { version = "1.53.2", features = ["full"] }
serialport = "4.10.1"
uuid = { version = "1.27.0", features = ["v4"] }
dirs = "7.0.0"
anyhow = "1.0.104"
bytes = "1.12.1"
argon2 = { version = "0.6.0", features = ["zeroize"] }
chacha20poly1305 = "0.11.0"
zeroize = { version = "1.9.1", features = ["serde"] }
base64 = "0.23.1"
getrandom = "0.4.3"
reqwest = { version = "0.13.5", features = ["form", "gzip", "brotli", "deflate", "socks"] }
tauri-plugin-dialog = "2"
portable-pty = "0.9.0"
zxcvbn = "3.1.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Memory", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_ErrorReporting"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Serve the bundled frontend instead of the dev server. `tauri build` turns this on; a bare
# `cargo build --release` needs `--features custom-protocol`, otherwise the window shows "can't reach this page".
custom-protocol = ["tauri/custom-protocol"]
