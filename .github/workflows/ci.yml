name: CI

# Pull requests only. A push to dev is built and published by dev-release.yml,
# and a push to main by release.yml.
on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    uses: ./.github/workflows/build.yml

  change-file:
    # One PR adds one docs/changes/<slug>.md with its decisions (AGENTS.md). Label a PR
    # `no-change-file` to skip; bot PRs (dependencies, releases) are skipped automatically.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-change-file.mjs "origin/${{ github.base_ref }}"
        env:
          SKIP: ${{ (contains(github.event.pull_request.labels.*.name, 'no-change-file') || endsWith(github.actor, '[bot]') || startsWith(github.head_ref, 'release-please--')) && '1' || '' }}

  pr-title:
    # Release notes and version bumps are derived from Conventional Commits.
    # PRs are squash-merged, so the PR title becomes the commit message.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
