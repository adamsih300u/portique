name: CI

# Pull requests only. A push to dev is built and published by dev-release.yml,
# and a push to main by release.yml.
on:
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  # Skipped (which counts as passing for required checks) when only docs or repo
  # metadata changed. pr-title below always runs.
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/checks.yml

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yml

  pr-title:
    # Release notes and version bumps are derived from Conventional Commits.
    # PRs are squash-merged, so the PR title becomes the commit message.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
