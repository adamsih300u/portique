name: CI

# Pull requests only. A push to dev is built and published by dev-release.yml,
# and a push to main by release.yml.
#
# `closed` is listed so that merging or closing a PR starts a run in the PR's
# concurrency group, which cancels any run still in flight. Every job is skipped
# on that closing run.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: github.event.action != 'closed'
    uses: ./.github/workflows/changes.yml

  # Skipped (which counts as passing for required checks) when only docs or repo
  # metadata changed. pr-title below always runs.
  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/checks.yml

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/build.yml

  change-file:
    if: github.event.action != 'closed'
    # One PR adds one docs/changes/<slug>.md with its decisions (AGENTS.md). Label a PR
    # `no-change-file` to skip; bot PRs (dependencies, releases) are skipped automatically.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-change-file.mjs "origin/${{ github.base_ref }}"
        env:
          SKIP: ${{ (contains(github.event.pull_request.labels.*.name, 'no-change-file') || endsWith(github.actor, '[bot]') || startsWith(github.head_ref, 'release-please--')) && '1' || '' }}

  pr-title:
    if: github.event.action != 'closed'
    # Release notes and version bumps are derived from Conventional Commits.
    # PRs are squash-merged, so the PR title becomes the commit message.
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
