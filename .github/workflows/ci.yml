name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  build:
    uses: ./.github/workflows/build.yml
    with:
      # main/dev builds are uniquely identifiable: portique-0.1.0-dev.123+abc1234-...
      version-suffix: -dev.${{ github.run_number }}-${{ github.sha }}

  pr-title:
    # Release notes and version bumps are derived from Conventional Commits.
    # PRs are squash-merged, so the PR title becomes the commit message.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
