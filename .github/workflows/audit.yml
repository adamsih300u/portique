# Known-vulnerability scan of the npm and cargo dependency trees. Advisories appear on their
# own schedule, so this runs weekly as well as when a lockfile changes. It is not part of CI.yml
# on purpose: a new advisory should not block an unrelated pull request.
name: Audit

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches: [dev]
    paths: [package-lock.json, src-tauri/Cargo.lock]
  pull_request:
    paths: [package-lock.json, src-tauri/Cargo.lock]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      # RUSTSEC-2023-0071 (Marvin timing attack on RSA private-key operations) is accepted: it affects the
      # `rsa` crate that `russh` pulls in, no fixed release exists, and we need RSA for imported keys and
      # RSA host keys. Remove the flag once `rsa` publishes a fix. See docs/changes/audit-ignore-rsa.md.
      - run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2023-0071
